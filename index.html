<!doctype html>

    <link

      rel="stylesheet"
    />
    <style>
      body {
        background: #f4f7f6;
        font-family: "Montserrat", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        color: #1b4332;
      }
      .container {
        width: 100%;
        max-width: 450px;
        text-align: center;
      }
      header {
        margin: 40px 0;
      }
      .logo {
        font-weight: 700;
        font-size: 1.4rem;

        border: 2px solid #2d6a4f;
        padding: 10px;
        display: inline-block;
      }

      /* BOTÃO DO YOUTUBE - O GRANDE DESTAQUE */
      .btn-youtube {
        background: #ff0000;
        color: white !important;
        padding: 20px;
        border-radius: 15px;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        margin-bottom: 30px;
        transition: 0.3s;
        box-shadow: 0 4px 15px rgba(255, 0, 0, 0.2);
      }
      .btn-youtube:hover {
        transform: scale(1.05);
      }

      .link-card {
        background: white;
        padding: 15px;
        border-radius: 12px;
        text-decoration: none;
        color: #2d6a4f;
        display: block;
        margin-bottom: 15px;
        font-weight: 600;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        transition: 0.3s;
        border-left: 5px solid #d4af37;
      }
      .link-card:hover {
        background: #eef5f2;
      }
    </style>
  </head>
